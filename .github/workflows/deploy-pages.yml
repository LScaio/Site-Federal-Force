# Publica o site no GitHub Pages a cada push (ou manualmente em Actions).
# Configuração única no GitHub: Settings → Pages → Source: "GitHub Actions".
# O endereço segue o nome do repositório: https://<usuário>.github.io/<repositório>/
name: Deploy GitHub Pages

on:
  push:
    branches: [claude/federal-force-cinema-site-d1ew93, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Imagens do Drive "Dados_Site_Federal" servidas pelo próprio site.
      # Se o Drive falhar, o build segue usando as imagens direto do Drive.
      - name: Sincronizar imagens do Drive
        id: drive
        continue-on-error: true
        run: npm run sync:drive

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DRIVE_SOURCE: ${{ steps.drive.outcome == 'success' && 'local' || 'drive' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
